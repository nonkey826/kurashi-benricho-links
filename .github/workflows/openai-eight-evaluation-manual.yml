name: Rakuten research evaluation (weekly)

on:
  schedule:
    - cron: '15 0 * * 1' # Monday 09:15 JST
  workflow_dispatch:
    inputs:
      mode:
        description: Research mode
        type: choice
        required: true
        default: new_products
        options:
          - new_products
          - fixed_eight

permissions:
  contents: write

concurrency:
  group: kurashi-research-update
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Rakuten API product evidence
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 scripts/fetch_rakuten_candidates.py
      - name: Evaluate new eligible candidates only (max five)
        if: github.event_name == 'schedule' || inputs.mode == 'new_products'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/evaluate_eight_products.py new_products
      - name: Commit updated candidate file only when changed
        if: inputs.mode == 'new_products'
        run: |
          if ! git diff --quiet -- research/claude-evaluated-candidates.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/claude-evaluated-candidates.json
            git commit -m 'research: append new BLOCK candidates'
            git push
          else
            echo 'No new candidates; no commit'
          fi
      - name: Legacy fixed-eight evaluation (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fixed_eight'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/evaluate_eight_products.py
      - name: Upload legacy evaluation only
        if: inputs.mode == 'fixed_eight'
        uses: actions/upload-artifact@v4
        with:
          name: openai-eight-evaluation
          path: research/openai-eight-evaluation.json
          if-no-files-found: warn
          retention-days: 2
