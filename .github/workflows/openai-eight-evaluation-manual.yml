name: OpenAI eight-product evidence evaluation (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate fixed eight research candidates (one OpenAI API request)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/evaluate_eight_products.py
      - name: Upload research-only evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-eight-evaluation
          path: research/openai-eight-evaluation.json
          if-no-files-found: warn
          retention-days: 2
